name: Paperworks Commercial CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  web-and-suite:
    name: Web Build, Typecheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Test Suites
        run: npm run test

      - name: Vite Production Build
        run: npm run build

  go-wails-backend:
    name: Wails Go Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install Linux GUI Dependencies for Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Ensure dist directory exists for embed.FS
        run: mkdir -p dist && touch dist/index.html

      - name: Verify Go Module & Vet
        run: |
          go mod tidy
          go vet ./...

      - name: Compile Backend Binaries
        run: go build -v ./...

  capacitor-mobile-sync:
    name: Capacitor Android Bridge Sync
    runs-on: ubuntu-latest
    needs: [web-and-suite]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Ensure gradlew is executable and format line endings
        run: |
          sed -i -e 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Verify Capacitor Android Sync
        run: npm run cap:sync

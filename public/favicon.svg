<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Subtle Gradient Defs -->
  <defs>
    <linearGradient id="paperGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="20" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Modern App Container -->
  <rect width="64" height="64" rx="14" fill="url(#paperGrad)"/>
  
  <!-- Back Stacked Document -->
  <rect x="23" y="11" width="26" height="34" rx="3" fill="#ffffff" opacity="0.35" transform="rotate(7 23 11)"/>
  
  <!-- Front Document Sheet -->
  <rect x="17" y="15" width="28" height="36" rx="3.5" fill="url(#sheetGrad)" stroke="#cbd5e1" stroke-width="0.75"/>
  
  <!-- Document Fold Corner -->
  <path d="M37 15V22H45" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.75"/>
  <path d="M37 15L45 22H37V15Z" fill="#94a3b8"/>

  <!-- Document Line Content (Tactical Blueprint / Text representation) -->
  <rect x="22" y="24" width="12" height="2.5" rx="1" fill="#4f46e5"/>
  <rect x="22" y="30" width="18" height="2" rx="1" fill="#94a3b8"/>
  <rect x="22" y="35" width="18" height="2" rx="1" fill="#cbd5e1"/>
  <rect x="22" y="40" width="14" height="2" rx="1" fill="#cbd5e1"/>

  <!-- Golden Quality Stamp / Sparkle -->
  <circle cx="43" cy="46" r="6" fill="#f59e0b"/>
  <path d="M43 43L44 45.2L46.2 46L44 46.8L43 49L42 46.8L39.8 46L42 45.2Z" fill="#ffffff"/>
</svg>
